# CloudlyRu — nginx server block. Скопировать на сервер:
#   sudo cp deploy/nginx/cloudlyru.conf /etc/nginx/sites-available/cloudlyru.conf
#   sudo ln -s /etc/nginx/sites-available/cloudlyru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d files.iq-factura.com
# НЕ затрагивает другие server-блоки (iq-rest и пр.).

server {
    listen 80;
    server_name files.iq-factura.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.iq-factura.com;

    ssl_certificate     /etc/letsencrypt/live/files.iq-factura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.iq-factura.com/privkey.pem;

    # Меньше информации о версии наружу
    server_tokens off;

    # Заголовки безопасности. HSTS без includeSubDomains: он покрывает только
    # files.iq-factura.com и её поддомены, соседние хосты домена не затрагиваются.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    # strict-origin-when-cross-origin, а не no-referrer: политика tile.openstreetmap.org
    # требует Referer от веб-страниц, без него сервер отдаёт «Access denied» вместо тайлов.
    # Наружу при этом уходит только origin — как в дефолте браузеров.
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Сжатие ответов. Без него JSON ленты и списков уходит как есть: лента весит 144 КБ
    # вместо 28 КБ, а список файлов на медленном канале открывается заметно дольше.
    # Картинки, видео и архивы не перечислены намеренно — они уже сжаты, и повторное
    # сжатие только жжёт CPU. gzip_proxied any нужен потому, что клиенты ходят через прокси
    # (мобильные операторы, корпоративные сети) и запрос приходит с Via/X-Forwarded-For.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Граница размера тела: раньше было 0 (безлимит на уровне nginx).
    # 64 ГиБ — это MAX_FILE_SIZE_MB из .env.example (65536 МБ); в коде у неё дефолт 51200 МБ
    # (50 ГиБ), то есть с одним лишь дефолтом nginx пускает больше, чем принимает приложение.
    # Так и задумано: строже должно быть приложение, а nginx — только грубый предохранитель.
    # Опускать эту границу ниже MAX_FILE_SIZE_MB нельзя: архивы Google Takeout на 53 ГБ
    # упрутся в 413 ещё до того, как их увидит приложение.
    client_max_body_size 64g;
    client_body_buffer_size 512k;
    proxy_request_buffering off;
    # Скачивание большого файла на медленном канале иначе буферизуется на диск (до 1 ГБ на запрос)
    proxy_max_temp_file_size 0;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ручка приёма почты: её дёргает Postfix с этого же сервера (pipe → localhost),
    # снаружи она не нужна вовсе. Токен в ней есть, но закрытый путь надёжнее токена.
    location = /api/v1/mail/inbound {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8305;
        proxy_http_version 1.1;
        # Поток ответа агента (ручки /projects/sessions/<id>/prompt и /events) не буферизуем
        # явно, а не только заголовком X-Accel-Buffering от приложения: без этого nginx копит
        # ответ и отдаёт его целиком в конце — живого вывода видно не будет вовсе.
        proxy_buffering off;
        # 1800s, а не 300s: complete сверяет sha256 по факту — сервер читает залитый
        # объект из S3 целиком (на десятках ГБ это минуты, а не секунды).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        send_timeout       1800s;
    }
}
