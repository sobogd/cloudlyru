# CloudlyRu — nginx server block. Скопировать на сервер:
#   sudo cp deploy/nginx/cloudlyru.conf /etc/nginx/sites-available/cloudlyru.conf
#   sudo ln -s /etc/nginx/sites-available/cloudlyru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат: sudo certbot --nginx -d files.iq-factura.com
# НЕ затрагивает другие server-блоки (iq-rest и пр.).

server {
    listen 80;
    server_name files.iq-factura.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name files.iq-factura.com;

    ssl_certificate     /etc/letsencrypt/live/files.iq-factura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.iq-factura.com/privkey.pem;

    # Меньше информации о версии наружу
    server_tokens off;

    # Заголовки безопасности. HSTS без includeSubDomains: он покрывает только
    # files.iq-factura.com и её поддомены, соседние хосты домена не затрагиваются.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Граница размера тела: раньше было 0 (безлимит на уровне nginx).
    # 64 ГиБ — это MAX_FILE_SIZE_MB приложения; публичный file-drop всё равно ≤20 МБ.
    client_max_body_size 64g;
    client_body_buffer_size 512k;
    proxy_request_buffering off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8305;
        proxy_http_version 1.1;
        # 1800s, а не 300s: complete сверяет sha256 по факту — сервер читает залитый
        # объект из S3 целиком (на десятках ГБ это минуты, а не секунды).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        send_timeout       1800s;
    }
}
