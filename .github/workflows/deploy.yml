name: Deploy (auto on push to main)

# Автодеплой CloudlyRu: любой push в main по путям приложения собирает и деплоит на прод.
# Раннер использует node 20 — тот же мажор, что на сервере (ABI нативных модулей argon2/prisma).
# Инфраструктурные файлы (.github, deploy/) деплой не триггерят.
# Ручной запуск: gh workflow run deploy.yml -f run_migrations=true|false

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Prisma migrate deploy
        required: false
        default: true
        type: boolean

concurrency:
  group: cloudlyru-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build
      - name: Build web (Vite + React SPA)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: "Prepare bundle (tar: dist + web + node_modules)"
        run: |
          tar czf cloudlyru.tgz \
            package.json pnpm-lock.yaml prisma dist web/dist node_modules deploy
      - name: Prisma migrate deploy (SSH tunnel to prod Postgres)
        if: ${{ github.event_name == 'push' || inputs.run_migrations }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/id_deploy -fN -L 5433:localhost:5432 "deployer@${SERVER_IP}"
          TUNNEL_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's#@[^/]+/#@localhost:5433/#')"
          DATABASE_URL="$TUNNEL_URL" pnpm exec prisma migrate deploy
      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "cloudlyru.tgz"
          target: "/home/deploy/apps/cloudlyru"
          overwrite: true
      - name: Swap runtime + write .env + pm2 reload
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          S3_FILES_ACCESS_KEY: ${{ secrets.S3_FILES_ACCESS_KEY }}
          S3_FILES_SECRET_KEY: ${{ secrets.S3_FILES_SECRET_KEY }}
          # Необязательный секрет: сколько фото конвертировать параллельно. `|| '3'` важен:
          # без него отсутствующий секрет экспортировал пустое значение, и оно перебивало
          # то, что записано в .env (dotenv не перезаписывает уже заданные переменные).
          CONVERT_PHOTO_PARALLEL: ${{ secrets.CONVERT_PHOTO_PARALLEL || '3' }}
          # Почта. Ключ шифрования паролей аккаунтов — обязательный секрет репозитория;
          # без него раздел работает, но аккаунт добавить нельзя (форма скажет об этом).
          MAIL_SECRET_KEY: ${{ secrets.MAIL_SECRET_KEY }}
          # Синхронизация с серверами почты. `|| 'true'` — как у CONVERT_PHOTO_PARALLEL:
          # без явного секрета берём рабочее значение, а не пустоту.
          MAIL_SYNC_ENABLED: ${{ secrets.MAIL_SYNC_ENABLED || 'true' }}
          # Токен ручки приёма почты от своего Postfix. Ручка без сессии, поэтому токен
          # обязателен; снаружи путь ещё закрыт в nginx.
          MAIL_INBOUND_TOKEN: ${{ secrets.MAIL_INBOUND_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL,SESSION_SECRET,ADMIN_LOGIN,ADMIN_PASSWORD,S3_FILES_ACCESS_KEY,S3_FILES_SECRET_KEY,CONVERT_PHOTO_PARALLEL,MAIL_SECRET_KEY,MAIL_SYNC_ENABLED,MAIL_INBOUND_TOKEN
          script: |
            set -e
            cd /home/deploy/apps/cloudlyru
            # распаковать бандл в свежую папку и атомарно заменить рантайм
            rm -rf incoming && mkdir incoming
            tar xzf cloudlyru.tgz -C incoming
            rm -f cloudlyru.tgz
            rm -rf dist node_modules
            mv incoming/dist ./dist
            mv incoming/node_modules ./node_modules
            cp incoming/package.json ./package.json
            cp incoming/pnpm-lock.yaml ./pnpm-lock.yaml
            cp -r incoming/prisma ./prisma
            mkdir -p web
            rm -rf web/dist
            cp -r incoming/web/dist web/dist
            # deploy/ нужен на сервере: оттуда cron запускает backup-db.sh
            rm -rf deploy
            cp -r incoming/deploy ./deploy
            rm -rf incoming

            cat > .env <<EOF
            NODE_ENV=production
            PORT=8305
            BASE_URL=https://files.iq-factura.com
            DATABASE_URL=$DATABASE_URL
            SESSION_SECRET=$SESSION_SECRET
            SESSION_TTL_DAYS=30
            API_TOKEN_TTL_DAYS=180
            COOKIE_NAME=cl_session
            ADMIN_LOGIN=$ADMIN_LOGIN
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            S3_FILES_ACCESS_KEY=$S3_FILES_ACCESS_KEY
            S3_FILES_SECRET_KEY=$S3_FILES_SECRET_KEY
            S3_FILES_ENDPOINT=https://nbg1.your-objectstorage.com
            S3_FILES_REGION=nbg1
            S3_FILES_BUCKET=cloudlyru
            S3_FILES_FORCE_PATH_STYLE=true
            UPLOAD_CHUNK_MAX_MB=20
            MAX_FILE_SIZE_MB=65536
            # Потолок незавершённых загрузок: телефон с ретраями иначе копит сессии в S3
            MAX_UPLOAD_SESSIONS_PER_USER=16
            # Часть прямой загрузки в S3 и срок жизни presigned-ссылки на неё
            UPLOAD_DIRECT_PART_MB=16
            UPLOAD_PART_URL_TTL_MIN=15
            # Префикс ключей в бакете: прод живёт без префикса (менять только вместе с бакетом)
            S3_FILES_PREFIX=
            TRASH_RETENTION_DAYS=30
            CONVERT_ENABLED=true
            # Оригинал — мастер: выключение молча удаляло бы сырьё после конвертации
            KEEP_ORIGINALS=true
            CONVERT_MEM_MB=3072
            # Кодек превью видео. h264 — libx264 veryfast: на 4 ядрах он упирается в декодер
            # исходника и заканчивает ролик за секунды там, где libaom-av1 считал его минутами.
            CONVERT_VIDEO_CODEC=h264
            # Сколько фото конвертировать параллельно: фото упираются в ядра (AVIF-энкод и
            # heif-convert), видео и PDF идут по одному независимо от значения. Значение —
            # из секрета репозитория, если он задан, иначе 3 (на сервере 4 vCPU).
            CONVERT_PHOTO_PARALLEL=${CONVERT_PHOTO_PARALLEL:-3}

            # ===== Почта =====
            # Ключ шифрования паролей почтовых аккаунтов (AES-256-GCM). Сами app-пароли
            # здесь не живут: их вводят в интерфейсе, и они ложатся в БД зашифрованными
            # этим ключом. Секрет репозитория MAIL_SECRET_KEY.
            MAIL_SECRET_KEY=$MAIL_SECRET_KEY
            # Синхронизация по IMAP: выключенная — почта не ходит вообще.
            MAIL_SYNC_ENABLED=${MAIL_SYNC_ENABLED:-true}
            # Плановый проход, секунды
            MAIL_SYNC_INTERVAL_SEC=120
            # Токен приёма от своего SMTP-сервера (Postfix → приложение)
            MAIL_INBOUND_TOKEN=$MAIL_INBOUND_TOKEN
            EOF
            chmod 600 .env
            pm2 reload cloudlyru --update-env --cwd /home/deploy/apps/cloudlyru \
              || pm2 start dist/main.js --name cloudlyru --time --cwd /home/deploy/apps/cloudlyru
            pm2 save
            # health-чек с ретраями
            ok=0
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8305/api/v1/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "--- healthz FAILED, последние логи: ---"
              pm2 logs cloudlyru --lines 60 --nostream || true
              exit 1
            fi
            echo "healthz OK"
