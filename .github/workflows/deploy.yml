name: Deploy (auto on push to main)

# Автодеплой CloudlyRu: любой push в main по путям приложения собирает и деплоит на прод.
# Раннер использует node 20 — тот же мажор, что на сервере (ABI нативных модулей argon2/prisma).
# Инфраструктурные файлы (.github, deploy/) деплой не триггерят.
# Ручной запуск: gh workflow run deploy.yml -f run_migrations=true|false

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Prisma migrate deploy
        required: false
        default: true
        type: boolean

concurrency:
  group: cloudlyru-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Секреты, без которых прод не поднимется"
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # src/config/env.ts в проде отказывается стартовать без ADMIN_LOGIN/ADMIN_PASSWORD
          # (иначе на пустой БД создаётся владелец admin/admin). Проверяем ДО выкладки: pm2
          # reload с процессом, который падает на старте, — это уже недоступный сервис, а
          # здесь деплой просто останавливается, и прод продолжает работать на прошлой версии.
          # Значения секретов не печатаем.
          miss=0
          for name in ADMIN_LOGIN ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::секрет репозитория $name не задан"
              miss=1
            fi
          done
          [ "$miss" = 0 ]
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm build
      - name: "Prepare bundle (tar: dist + prisma + node_modules)"
        run: |
          tar czf cloudlyru.tgz \
            package.json pnpm-lock.yaml prisma dist node_modules deploy
      - name: Prisma migrate deploy (SSH tunnel to prod Postgres)
        if: ${{ github.event_name == 'push' || inputs.run_migrations }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/id_deploy -fN -L 5433:localhost:5432 "deployer@${SERVER_IP}"
          TUNNEL_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's#@[^/]+/#@localhost:5433/#')"
          DATABASE_URL="$TUNNEL_URL" pnpm exec prisma migrate deploy
      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "cloudlyru.tgz"
          target: "/home/deploy/apps/cloudlyru"
          overwrite: true
      - name: Swap runtime + write .env + pm2 reload
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          S3_FILES_ACCESS_KEY: ${{ secrets.S3_FILES_ACCESS_KEY }}
          S3_FILES_SECRET_KEY: ${{ secrets.S3_FILES_SECRET_KEY }}
          # Необязательный секрет: сколько фото конвертировать параллельно. `|| '3'` важен:
          # без него отсутствующий секрет экспортировал пустое значение, и оно перебивало
          # то, что записано в .env (dotenv не перезаписывает уже заданные переменные).
          CONVERT_PHOTO_PARALLEL: ${{ secrets.CONVERT_PHOTO_PARALLEL || '3' }}
          # Почта. Ключ шифрования паролей аккаунтов — обязательный секрет репозитория;
          # без него раздел работает, но добавить аккаунт нельзя (ручки создания в API нет).
          MAIL_SECRET_KEY: ${{ secrets.MAIL_SECRET_KEY }}
          # Синхронизация с серверами почты. `|| 'true'` — как у CONVERT_PHOTO_PARALLEL:
          # без явного секрета берём рабочее значение, а не пустоту.
          MAIL_SYNC_ENABLED: ${{ secrets.MAIL_SYNC_ENABLED || 'true' }}
          # Токен ручки приёма почты от своего Postfix. Ручка без сессии, поэтому токен
          # обязателен; снаружи путь ещё закрыт в nginx.
          MAIL_INBOUND_TOKEN: ${{ secrets.MAIL_INBOUND_TOKEN }}
          # Необратимая чистка копий писем у провайдера. Раньше она работала всегда, вместе
          # с синхронизацией; теперь это отдельный выключатель, и по умолчанию ВЫКЛЮЧЕН, чтобы
          # разрушительная операция не оставалась включённой «сама собой». Включение/выключение
          # идёт секретом репозитория, а не правкой .env на сервере: этот файл перезаписывается
          # при каждом деплое.
          MAIL_PURGE_ENABLED: ${{ secrets.MAIL_PURGE_ENABLED || 'false' }}
          # «Только отчёт»: кандидаты на удаление отбираются и логируются, ничего не удаляется.
          MAIL_PURGE_DRY_RUN: ${{ secrets.MAIL_PURGE_DRY_RUN || 'false' }}
          # Потолок размера одного письма, МБ: больше — письмо пропускается с причиной в логе.
          MAIL_MAX_MESSAGE_MB: ${{ secrets.MAIL_MAX_MESSAGE_MB || '64' }}
          # ===== Фактуры (раздел перенесён из сервиса iq-factura) =====
          # Компания-эмитент. Раньше выбиралась из связки пользователь↔компания, теперь
          # владелец один — id фиксируется секретом репозитория.
          FACTURA_COMPANY_ID: ${{ secrets.FACTURA_COMPANY_ID }}
          # Бакет с PDF инвойсов и сканами: креды общие (S3_FILES_*), имя бакета своё.
          S3_INVOICES_BUCKET: ${{ secrets.S3_INVOICES_BUCKET || 'iq-factura-invoices' }}
          # VeriFactu: disabled | local | submit, и окружение AEAT. До переноса данных
          # держим disabled: сервис с включённой отправкой, но без компании и сертификата,
          # не должен подниматься вовсе (это проверяет src/config/env.ts).
          VERIFACTU_MODE: ${{ secrets.VERIFACTU_MODE || 'disabled' }}
          VERIFACTU_ENV: ${{ secrets.VERIFACTU_ENV || 'sandbox' }}
          # Мастер-ключ шифрования сертификата: переносится из iq-factura без изменений —
          # иначе уже загруженный сертификат не расшифруется.
          VERIFACTU_MASTER_KEY: ${{ secrets.VERIFACTU_MASTER_KEY }}
          # Ключ Gemini: разбор сканов расходов и поданных деклараций, разбор текста контрагента.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Раздел «Чат»: модель на домашнем маке (LM Studio), поиск и чтение страниц — рядом с ней.
          # Адреса — это порты reverse-SSH туннеля мака, открытые на VPS только на loopback;
          # по умолчанию они совпадают со значениями в src/config/env.ts, а секретами
          # переопределяются, если туннель когда-нибудь переедет на другие порты.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'http://127.0.0.1:18812' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'qwen/qwen3.5-9b' }}
          WEBSEARCH_URL: ${{ secrets.WEBSEARCH_URL || 'http://127.0.0.1:18814' }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL,ADMIN_LOGIN,ADMIN_PASSWORD,S3_FILES_ACCESS_KEY,S3_FILES_SECRET_KEY,CONVERT_PHOTO_PARALLEL,MAIL_SECRET_KEY,MAIL_SYNC_ENABLED,MAIL_INBOUND_TOKEN,MAIL_PURGE_ENABLED,MAIL_PURGE_DRY_RUN,MAIL_MAX_MESSAGE_MB,FACTURA_COMPANY_ID,S3_INVOICES_BUCKET,VERIFACTU_MODE,VERIFACTU_ENV,VERIFACTU_MASTER_KEY,GEMINI_API_KEY,LLM_BASE_URL,LLM_MODEL,WEBSEARCH_URL
          script: |
            set -e
            cd /home/deploy/apps/cloudlyru
            # распаковать бандл в свежую папку и атомарно заменить рантайм
            rm -rf incoming && mkdir incoming
            tar xzf cloudlyru.tgz -C incoming
            rm -f cloudlyru.tgz
            rm -rf dist node_modules
            mv incoming/dist ./dist
            mv incoming/node_modules ./node_modules
            cp incoming/package.json ./package.json
            cp incoming/pnpm-lock.yaml ./pnpm-lock.yaml
            # prisma перезаписываем целиком: `cp -r incoming/prisma ./prisma` при существующем
            # каталоге копирует внутрь него и оставляет на сервере prisma/prisma/migrations —
            # свежие миграции лежали во вложенной копии, а видимый prisma/ оставался старым
            rm -rf prisma
            cp -r incoming/prisma ./prisma
            # Веб-клиента больше нет: раньше здесь лежала SPA из web/dist, а сервер её
            # раздавал. Приложение — только мобильное, страниц сервер не отдаёт.
            rm -rf web
            # deploy/ нужен на сервере: оттуда cron запускает backup-db.sh
            rm -rf deploy
            cp -r incoming/deploy ./deploy
            rm -rf incoming

            cat > .env <<EOF
            NODE_ENV=production
            PORT=8305
            BASE_URL=https://files.iq-factura.com
            DATABASE_URL=$DATABASE_URL
            SESSION_TTL_DAYS=30
            API_TOKEN_TTL_DAYS=180
            COOKIE_NAME=cl_session
            # Первый владелец: приложение отказывается стартовать, если пароль — дефолт,
            # плейсхолдер CHANGE_ME* или совпадает с логином (см. src/config/env.ts)
            ADMIN_LOGIN=$ADMIN_LOGIN
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            S3_FILES_ACCESS_KEY=$S3_FILES_ACCESS_KEY
            S3_FILES_SECRET_KEY=$S3_FILES_SECRET_KEY
            S3_FILES_ENDPOINT=https://nbg1.your-objectstorage.com
            S3_FILES_REGION=nbg1
            S3_FILES_BUCKET=cloudlyru
            S3_FILES_FORCE_PATH_STYLE=true
            UPLOAD_CHUNK_MAX_MB=20
            MAX_FILE_SIZE_MB=65536
            # Потолок незавершённых загрузок: телефон с ретраями иначе копит сессии в S3
            MAX_UPLOAD_SESSIONS_PER_USER=16
            # Часть прямой загрузки в S3 и срок жизни presigned-ссылки на неё
            UPLOAD_DIRECT_PART_MB=16
            UPLOAD_PART_URL_TTL_MIN=15
            # Префикс ключей в бакете: прод живёт без префикса (менять только вместе с бакетом)
            S3_FILES_PREFIX=
            TRASH_RETENTION_DAYS=30
            CONVERT_ENABLED=true
            # Оригинал — мастер: выключение молча удаляло бы сырьё после конвертации
            KEEP_ORIGINALS=true
            CONVERT_MEM_MB=3072
            # Кодек превью видео. h264 — libx264 veryfast: на 4 ядрах он упирается в декодер
            # исходника и заканчивает ролик за секунды там, где libaom-av1 считал его минутами.
            CONVERT_VIDEO_CODEC=h264
            # Сколько фото конвертировать параллельно: фото упираются в ядра (AVIF-энкод и
            # heif-convert), видео и PDF идут по одному независимо от значения. Значение —
            # из секрета репозитория, если он задан, иначе 3 (на сервере 4 vCPU).
            CONVERT_PHOTO_PARALLEL=${CONVERT_PHOTO_PARALLEL:-3}

            # ===== Почта =====
            # Ключ шифрования паролей почтовых аккаунтов (AES-256-GCM). Сами app-пароли
            # здесь не живут: их вводят в интерфейсе, и они ложатся в БД зашифрованными
            # этим ключом. Секрет репозитория MAIL_SECRET_KEY.
            MAIL_SECRET_KEY=$MAIL_SECRET_KEY
            # Синхронизация по IMAP: выключенная — почта не ходит вообще.
            MAIL_SYNC_ENABLED=${MAIL_SYNC_ENABLED:-true}
            # Плановый проход, секунды
            MAIL_SYNC_INTERVAL_SEC=120
            # Токен приёма от своего SMTP-сервера (Postfix → приложение)
            MAIL_INBOUND_TOKEN=$MAIL_INBOUND_TOKEN
            # Чистка копий писем у провайдера: по умолчанию выключена (см. комментарий выше).
            # Включать осознанно и лучше сначала в режиме отчёта:
            #   gh secret set MAIL_PURGE_DRY_RUN --body true   → посмотреть лог отбора
            #   gh secret set MAIL_PURGE_ENABLED  --body true   → включить удаление
            MAIL_PURGE_ENABLED=${MAIL_PURGE_ENABLED:-false}
            MAIL_PURGE_DRY_RUN=${MAIL_PURGE_DRY_RUN:-false}
            MAIL_MAX_MESSAGE_MB=${MAIL_MAX_MESSAGE_MB:-64}

            # ===== Фактуры =====
            # Компания-эмитент: id из базы iq_factura (переносится вместе с данными).
            FACTURA_COMPANY_ID=$FACTURA_COMPANY_ID
            # Бакет с PDF инвойсов и сканами расходов; креды и endpoint — общие S3_FILES_*.
            S3_INVOICES_BUCKET=${S3_INVOICES_BUCKET:-iq-factura-invoices}
            # Отправка в AEAT. Значения по умолчанию безопасные: без явного секрета сервис
            # поднимется с выключенным VeriFactu, а не начнёт отправлять в боевую налоговую.
            VERIFACTU_MODE=${VERIFACTU_MODE:-disabled}
            VERIFACTU_ENV=${VERIFACTU_ENV:-sandbox}
            # Тот же мастер-ключ, что был в iq-factura: иначе сертификат не расшифруется.
            VERIFACTU_MASTER_KEY=$VERIFACTU_MASTER_KEY
            VERIFACTU_INSTALLATION_ID=
            # Разбор сканов и текста (Gemini). Пусто — разбор отключён.
            GEMINI_API_KEY=$GEMINI_API_KEY

            # ===== Чат с ИИ =====
            # Модель, поиск и агент живут на домашнем маке и приходят через reverse-SSH туннель
            # (agents/run-dsh-tunnel.sh на маке: 18812 — LM Studio, 18814 — поиск, 18816 — агент
            # на телефоне). Мак выключен или спит — раздел «Чат» отвечает «локальная модель
            # недоступна», остальное облако работает как обычно.
            LLM_BASE_URL=$LLM_BASE_URL
            LLM_MODEL=$LLM_MODEL
            LLM_REASONING=none
            WEBSEARCH_URL=$WEBSEARCH_URL
                        EOF
            chmod 600 .env
            pm2 reload cloudlyru --update-env --cwd /home/deploy/apps/cloudlyru \
              || pm2 start dist/main.js --name cloudlyru --time --cwd /home/deploy/apps/cloudlyru
            pm2 save
            # health-чек с ретраями
            ok=0
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8305/api/v1/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "--- healthz FAILED, последние логи: ---"
              pm2 logs cloudlyru --lines 60 --nostream || true
              exit 1
            fi
            echo "healthz OK"
