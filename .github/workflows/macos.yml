name: macOS app (build + publish)

# Ручной прогон: собирает настольную сборку Flutter-клиента (flutter/, каталог macos/)
# и публикует архив с Cloudly.app в релизный артефакт S3, откуда сборку всегда отдаёт
# https://files.iq-factura.com/macos. Приложение на маке обновляется кнопкой в «Настройках»:
# скачивает архив, проверяет размер и sha256 и подменяет свою сборку (см.
# flutter/lib/features/settings/macos_update.dart).
#
# Автоматического запуска по push нет: релиз — осознанное действие, перед ним нужно поднять
# номер сборки в flutter/pubspec.yaml (`version: 1.0.0+51`). Номер общий с Android: то же `+N`
# даёт versionCode в APK и CFBundleVersion в настольной сборке, и скрипт публикации не даёт
# положить сборку с тем же или меньшим номером.
# Ручной запуск: gh workflow run macos.yml --repo sobogd/cloudlyru
#
# Про подпись. Сборка здесь не подписывается Developer ID и не нотаризуется: приложение качает
# её само обычным HTTP-клиентом, карантинного флага на файле не появляется, и Gatekeeper
# заменённую сборку не блокирует. Но если сборку понадобится отдавать кому-то ещё (или качать
# браузером), её придётся подписать сертификатом Developer ID и нотаризовать — иначе система
# откажется её запускать. Это отдельная работа: сертификат в секретах + `notarytool submit`.
#
# Секреты: только S3_FILES_ACCESS_KEY / S3_FILES_SECRET_KEY (те же, что у автодеплоя).

on:
  workflow_dispatch:

concurrency:
  group: cloudlyru-macos
  cancel-in-progress: false

env:
  # Тот же Flutter, что у нас локально: новая stable может поменять Xcode-шаблон и сломать
  # сборку в самый неподходящий момент, а релиз должен собираться воспроизводимо.
  FLUTTER_VERSION: 3.47.4

jobs:
  macos:
    # Настольную сборку можно собрать только на маке: нужен Xcode. macos-latest — Apple Silicon,
    # то есть сборка под arm64; для x86_64 понадобился бы отдельный раннер (macos-13).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Версия из pubspec
        id: version
        working-directory: flutter
        run: |
          # version: 1.0.0+51 → name=1.0.0, code=51. Номер общий с Android: из него же
          # собирается versionCode для APK.
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          name="${raw%%+*}"
          code="${raw##*+}"
          test -n "$name" || { echo "в pubspec.yaml нет version"; exit 1; }
          test "$code" != "$raw" || { echo "в version нет номера сборки после «+»: $raw"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "собираю $name (номер $code)"

      - name: Сборка релиза
        working-directory: flutter
        run: |
          flutter pub get
          flutter build macos --release

      - name: Архив со сборкой
        working-directory: flutter/build/macos/Build/Products/Release
        run: |
          # ditto, а не zip: он сохраняет права и символические ссылки внутри бандла — обычный
          # zip их теряет, и распакованное приложение не запускается.
          ditto -c -k --keepParent Cloudly.app Cloudly.zip
          ls -lh Cloudly.zip

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Зависимости для публикации (только @aws-sdk/client-s3)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Публикация сборки в /macos
        env:
          S3_FILES_ACCESS_KEY: ${{ secrets.S3_FILES_ACCESS_KEY }}
          S3_FILES_SECRET_KEY: ${{ secrets.S3_FILES_SECRET_KEY }}
          S3_FILES_ENDPOINT: https://nbg1.your-objectstorage.com
          S3_FILES_REGION: nbg1
          S3_FILES_BUCKET: cloudlyru
          S3_FILES_FORCE_PATH_STYLE: 'true'
          S3_FILES_PREFIX: ''
          CLOUDLY_BASE_URL: https://files.iq-factura.com
        run: |
          node scripts/publish-macos.mjs \
            flutter/build/macos/Build/Products/Release/Cloudly.zip \
            --version-name "${{ steps.version.outputs.name }}" \
            --version-code "${{ steps.version.outputs.code }}"

      - name: Итог в summary
        if: always()
        run: |
          {
            echo "### Настольное приложение (macOS)"
            echo "- версия: ${{ steps.version.outputs.name }} (номер ${{ steps.version.outputs.code }})"
            echo "- постоянная ссылка: https://files.iq-factura.com/macos"
            echo "- сборка без подписи: годится для обновления кнопкой из приложения,"
            echo "  но не для передачи на другой мак (там нужен Developer ID и нотаризация)"
          } >> "$GITHUB_STEP_SUMMARY"
