name: Android APK (build + publish)

# Ручной прогон: собирает юнит-тесты, подписанный релиз и публикует его в релизный артефакт S3,
# откуда сборку всегда отдаёт https://files.iq-factura.com/apk.
#
# Автоматического запуска по push нет: пока APK публикуется напрямую
# (`node --env-file=$HOME/work/.env scripts/publish-apk.mjs <apk>`), чтобы прогон не спотыкался
# о запрет повторной публикации того же versionCode.
# Ручной запуск: gh workflow run android.yml
#
# Секреты: ANDROID_KEYSTORE_BASE64 (файл ~/.cloudly-android-release.jks в base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# S3_FILES_ACCESS_KEY / S3_FILES_SECRET_KEY (уже есть — их использует автодеплой).

on:
  workflow_dispatch:

concurrency:
  group: cloudlyru-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android SDK (platform 35, build-tools 35)
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Юнит-тесты и сборка релиза
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Зависимости для публикации (только @aws-sdk/client-s3)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Публикация сборки в /apk
        env:
          S3_FILES_ACCESS_KEY: ${{ secrets.S3_FILES_ACCESS_KEY }}
          S3_FILES_SECRET_KEY: ${{ secrets.S3_FILES_SECRET_KEY }}
          S3_FILES_ENDPOINT: https://nbg1.your-objectstorage.com
          S3_FILES_REGION: nbg1
          S3_FILES_BUCKET: cloudlyru
          S3_FILES_FORCE_PATH_STYLE: 'true'
          S3_FILES_PREFIX: ''
          CLOUDLY_BASE_URL: https://files.iq-factura.com
        run: node scripts/publish-apk.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: Итог в summary
        if: always()
        run: |
          {
            echo "### Android-клиент"
            if [ -f android/app/build/outputs/apk/release/output-metadata.json ]; then
              node -e "const m=require('./android/app/build/outputs/apk/release/output-metadata.json');const e=m.elements[0];console.log('- собрано: '+e.versionName+' (versionCode '+e.versionCode+')');"
            else
              echo "- сборка не дошла до APK"
            fi
            echo "- постоянная ссылка: https://files.iq-factura.com/apk"
          } >> "$GITHUB_STEP_SUMMARY"
