name: iOS app (build + publish)

# Сборка и публикация клиента для iPad и iPhone (Flutter-клиент из flutter/, каталог ios/):
# .ipa уезжает в S3, откуда её всегда отдаёт https://files.iq-factura.com/ios, а страница
# https://files.iq-factura.com/ios/install ставит сборку на устройство по воздуху (itms-services).
#
# Запускается сам — push в main, тронувший `flutter/**`. Пути здесь не украшение, а экономия:
# iOS-сборка (и раннер) дороже остальных, и поднимать её на push в `src/**` незачем.
# Ручной запуск (пересобрать тот же номер):
#   gh workflow run ios.yml -f force=true
#
# Номер версии обязателен. Push, тронувший `flutter/**`, но не поднявший `version:` в
# `flutter/pubspec.yaml`, уронит публикацию: номер общий с Android и macOS, и скрипт не даёт
# положить сборку с тем же или меньшим номером.
#
# Про сборку. Она Ad Hoc: подписана профилем, в который вписаны конкретные устройства по UDID.
# Поэтому установить её можно только на них, зато режим разработчика на устройстве не нужен,
# а срок жизни профиля — год. Проще всего добавить устройство так: подключить его и поставить
# на него локальную сборку (Xcode зарегистрирует устройство в аккаунте сам), а дальше сборка
# в CI подхватит его сама: профиль обновляет Xcode. Руками устройство заводится в кабинете
# разработчика или через App Store Connect API (POST /v1/devices).
#
# Сам сборщик живёт в scripts/build-ios.sh: там же объяснено, почему `flutter build ipa`
# здесь не подходит. Шаги воркфлоу только готовят ключ и сертификаты, дальше всё делает скрипт.
#
# Про сертификаты. Подпись автоматическая, но сертификаты стабильные: они лежат в секретах,
# раннер кладёт их в одноразовую связку ключей, и дальше Xcode подписывает ими (архив —
# development-личностью, Ad Hoc экспорт — distribution). Раньше сертификатов на раннере не
# было, Xcode выпускал себе новые на каждый прогон, а воркфлоу перед сборкой чистил хвосты
# прошлых прогонов — то есть каждая сборка отзывала сертификаты предыдущей и Apple присылала
# об этом письмо. Теперь отзывать нечего: их разово готовит scripts/asc-signing-setup.mjs,
# он же нужен, когда срок истечёт (сертификаты живут год).
#
# Секреты:
#   IOS_SIGNING_PEM — оба сертификата с приватными ключами (Apple Development и Apple
#     Distribution) одним PEM-файлом в base64; команду `gh secret set` печатает
#     scripts/asc-signing-setup.mjs, значение читается из файла и на экран не выводится;
#   ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID — из кабинета разработчика (ключ App Store Connect);
#   ASC_KEY_P8 — сам файл .p8 в base64 (`base64 -i AuthKey_XXXX.p8 | gh secret set ASC_KEY_P8`);
#   S3_FILES_ACCESS_KEY / S3_FILES_SECRET_KEY — те же, что у автодеплоя.

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
  workflow_dispatch:
    inputs:
      force:
        description: Опубликовать поверх того же номера сборки
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudlyru-ios
  # Новый push отменяет предыдущую сборку: две одновременные сборки одного номера не должны
  # доходить до публикации вдвоём.
  cancel-in-progress: true

env:
  # Тот же Flutter, что локально: новая stable может поменять Xcode-шаблон и сломать сборку
  # в самый неподходящий момент, а релиз должен собираться воспроизводимо.
  FLUTTER_VERSION: 3.47.4

jobs:
  ios:
    # Только мак: нужен Xcode. macos-latest — Apple Silicon, то есть сборка под arm64 (все
    # актуальные iPad и iPhone), для старых armv7 нужен был бы отдельный раннер.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # CocoaPods на образах раннера обычно уже стоит, но от него зависит вся сборка iOS
      # (у части плагинов нет поддержки Swift Package Manager), поэтому проверяем явно.
      - name: CocoaPods
        run: pod --version || brew install cocoapods

      # Node и зависимости нужны только для публикации: сам сборщик — скрипт на bash,
      # а в S3 сборку кладёт `scripts/publish-ios.mjs` (ему нужен только @aws-sdk/client-s3).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Зависимости для публикации (только @aws-sdk/client-s3)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Ключ приходит секретом в base64: так его можно положить в секреты одной командой,
      # не копируя содержимое файла в интерфейс. Файл живёт до конца задания во временном
      # каталоге раннера — в репозиторий и в артефакты он не попадает. Ключ нужен подписи:
      # у Xcode право выпускать профили и регистрировать устройства (`-allowProvisioningUpdates`).
      - name: Ключ App Store Connect
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$KEY_P8" || { echo "нет секрета ASC_KEY_P8"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_FILE=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Падаем до сборки, а не после: без сертификатов скрипт ушёл бы в режим для своего мака
      # и Xcode снова начал бы выпускать их на раннере — ровно то, от чего мы ушли.
      - name: Сертификаты подписи на месте
        env:
          IOS_SIGNING_PEM: ${{ secrets.IOS_SIGNING_PEM }}
        run: |
          test -n "$IOS_SIGNING_PEM" || {
            echo "нет секрета IOS_SIGNING_PEM — сертификаты готовит scripts/asc-signing-setup.mjs" >&2
            exit 1
          }

      # Сборка, подпись и публикация. Ключи S3 приходят в скрипт переменными окружения,
      # а в публикатор уезжают через `node --env-file`, поэтому в вывод не попадают.
      - name: Сборка, подпись и публикация в /ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_SIGNING_PEM: ${{ secrets.IOS_SIGNING_PEM }}
          S3_FILES_ACCESS_KEY: ${{ secrets.S3_FILES_ACCESS_KEY }}
          S3_FILES_SECRET_KEY: ${{ secrets.S3_FILES_SECRET_KEY }}
          S3_FILES_ENDPOINT: https://nbg1.your-objectstorage.com
          S3_FILES_REGION: nbg1
          S3_FILES_BUCKET: cloudlyru
          S3_FILES_FORCE_PATH_STYLE: 'true'
          S3_FILES_PREFIX: ''
          CLOUDLY_BASE_URL: https://files.iq-factura.com
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            ./scripts/build-ios.sh --force
          else
            ./scripts/build-ios.sh
          fi

      - name: Итог в summary
        if: always()
        run: |
          {
            echo "### Приложение для iPad и iPhone"
            echo "- установка на устройстве: https://files.iq-factura.com/ios/install"
            echo "- сам архив: https://files.iq-factura.com/ios"
            echo "- сборка Ad Hoc: ставится только на устройства из профиля;"
            echo "  режим разработчика не нужен, профиль живёт год"
          } >> "$GITHUB_STEP_SUMMARY"
