# Reference nginx server block for status.iq-factura.com — runs on the VPS,
# NOT on the Mac. The Mac exposes the status server through a reverse SSH
# tunnel (launchd com.agent.mac-tunnel); nginx fronts whatever local
# VPS port the tunnel maps to the Mac's 127.0.0.1:18810.
#
# Adjust <TUNNEL_PORT> to the actual port the tunnel listens on for the VPS.
#
# TLS lines are added automatically by: certbot --nginx -d status.iq-factura.com
#
# Basic-auth setup on the VPS:
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/.htpasswd-mac-status <user>
#
# Install:
#   cp status.iq-factura.conf /etc/nginx/sites-available/status.iq-factura.com
#   ln -s /etc/nginx/sites-available/status.iq-factura.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name status.iq-factura.com;

    auth_basic "Mac status";
    auth_basic_user_file /etc/nginx/.htpasswd-mac-status;

    # PWA support: Chrome refuses to register a service worker behind HTTP basic
    # auth (the SW script request never carries the Authorization header), so
    # without this the panel was NOT installable. These paths carry no secrets
    # and bypass auth so the SW can register; the pages and /api/* stay
    # protected. Live file: /etc/nginx/sites-available/status.iq-factura.conf.
    location ~ ^/(sw\.js|manifest\.json|icon-192\.png|icon-512\.png)$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:<TUNNEL_PORT>;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:<TUNNEL_PORT>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Сервис-токен панели: браузер его не знает, nginx подставляет сам (значение — то же,
        # что MAC_SERVICE_TOKEN на маке). Нужен, когда на панели включена проверка X-Mac-Token.
        proxy_set_header X-Mac-Token <MAC_SERVICE_TOKEN>;
        proxy_read_timeout 10s;
    }
}
